
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/bola.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>FutScore</title>
</head>
<body>

<div class="app">

    <header>
        <img src="imagens/cf2027.png" alt="Imagem do campeonato">
        <h1 id="nome-campeonato">Carregando campeonato...</h1>
        <h2>Estatísticas dos Jogos</h2>
    </header>

    <main class="estatisticas-jogos">

        <section class="painel-estatisticas">

            <div class="navegacao-estatisticas">

                <button id="estatistica-anterior"
                        class="btn-estatistica"
                        type="button">
                    &#10094;
                </button>

                <h3 id="titulo-estatistica">Artilharia</h3>

                <button id="proxima-estatistica"
                        class="btn-estatistica"
                        type="button">
                    &#10095;
                </button>

            </div>

            <div class="cabecalho-estatistica">
                <span>#</span>
                <span>Jogador</span>
                <span>Time</span>
                <span id="titulo-valor">Gols</span>
            </div>

            <div id="lista-estatisticas">
                <!-- Dados inseridos pelo JavaScript -->
            </div>

        </section>

    </main>

    <nav class="bottom-nav">

        <a href="det-camp.html" class="nav-item">
            <img src="imagens/home.png"
                 alt="Início"
                 class="nav-icon">
            <span>Página Inicial</span>
        </a>

        <a href="tab-jogos.html" class="nav-item">
            <img src="imagens/tab-jogos.png"
                 alt="Jogos"
                 class="nav-icon">
            <span>Jogos</span>
        </a>

        <a href="classificacao.html" class="nav-item">
            <img src="imagens/classificacao.png"
                 alt="Classificação"
                 class="nav-icon">
            <span>Classificação</span>
        </a>

        <a href="estatisticas.html" class="nav-item">
            <img src="imagens/estatisticas.png"
                 alt="Estatísticas"
                 class="nav-icon">
            <span>Estatísticas</span>
        </a>

    </nav>

    <footer>
        <p>&copy; <span id="ano"></span> - Desenvolvido por Team XP</p>
    </footer>

</div>

<script src="js/script.js"></script>

<script>
    // Recupera o ID do campeonato selecionado
    const parametros = new URLSearchParams(window.location.search);
    const campeonatoId = parametros.get("id");

    // Consulta os dados do campeonato na API
    async function carregarNomeCampeonato() {

        const titulo = document.getElementById("nome-campeonato");

        if (!campeonatoId) {
            titulo.textContent = "Campeonato não selecionado";
            return;
        }

        try {
            const resposta = await fetch(
                "http://localhost:8080/api/campeonatos/" +
                encodeURIComponent(campeonatoId)
            );

            if (!resposta.ok) {
                throw new Error("Erro HTTP: " + resposta.status);
            }

            const campeonato = await resposta.json();

            titulo.textContent =
                campeonato.nome + " " + campeonato.ano;

            document.title =
                campeonato.nome + " " + campeonato.ano +
                " - Estatísticas - FutScore";

        } catch (erro) {
            console.error(
                "Erro ao carregar campeonato:",
                erro
            );

            titulo.textContent =
                "Não foi possível carregar o campeonato.";
        }
    }

    carregarNomeCampeonato();
</script>

</body>
</html>
