
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/bola.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>FutScore</title>
</head>
<body>

    <div class="app">
        <header>
            <img src="imagens/cf2027.png" alt="Imagem do campeonato">
            <h1 id="nome-campeonato">Carregando campeonato...</h1>
        </header>

        <main>
            <ul>
                <li>
                    <a href="tab-jogos.html" id="link-jogos">
                        <img style="width: 50px;"
                             src="imagens/tab-jogos.png"
                             alt="tabela de jogos">
                        Tabela de Jogos
                    </a>
                </li>

                <li>
                    <a href="classificacao.html" id="link-classificacao">
                        <img style="width: 50px;"
                             src="imagens/classificacao.png"
                             alt="classificação">
                        Classificação
                    </a>
                </li>

                <li>
                    <a href="estatisticas.html" id="link-estatisticas">
                        <img style="width: 50px;"
                             src="imagens/estatisticas.png"
                             alt="estatísticas">
                        Estatísticas
                    </a>
                </li>
            </ul>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <img src="imagens/voltar.png"
                     alt="Início"
                     class="nav-icon">
                <span>Voltar</span>
            </a>
        </nav>

        <footer>
            <p>&copy; <span id="ano"></span> - Desenvolvido por Team XP</p>
        </footer>
    </div>

    <script src="js/script.js"></script>

    <script>
        // Identifica o campeonato selecionado
        const parametros = new URLSearchParams(window.location.search);
        const campeonatoId = parametros.get("id");

        // Repassa o ID para as outras páginas
        if (campeonatoId) {
            document.getElementById("link-jogos").href =
                "tab-jogos.html?id=" + encodeURIComponent(campeonatoId);

            document.getElementById("link-classificacao").href =
                "classificacao.html?id=" + encodeURIComponent(campeonatoId);

            document.getElementById("link-estatisticas").href =
                "estatisticas.html?id=" + encodeURIComponent(campeonatoId);
        }

        // Consulta os dados reais do campeonato
        async function carregarDetalhesCampeonato() {

            const titulo = document.getElementById("nome-campeonato");

            if (!campeonatoId) {
                titulo.textContent = "Campeonato não selecionado";
                return;
            }

            try {
                const resposta = await fetch(
                    "http://localhost:8080/api/campeonatos/" +
                    encodeURIComponent(campeonatoId)
                );

                if (!resposta.ok) {
                    throw new Error("Erro HTTP: " + resposta.status);
                }

                const campeonato = await resposta.json();

                titulo.textContent =
                    campeonato.nome + " " + campeonato.ano;

                document.title =
                    campeonato.nome + " " + campeonato.ano + " - FutScore";

            } catch (erro) {
                console.error(
                    "Erro ao carregar campeonato:",
                    erro
                );

                titulo.textContent =
                    "Não foi possível carregar o campeonato.";
            }
        }

        carregarDetalhesCampeonato();
    </script>

</body>
</html>
